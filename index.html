<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boyani | My First Project</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f3f2ef;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      color: #000000e6;
    }

    .profile-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.08);
    }

    /* LinkedIn-style cover / background image */
    .cover {
      height: 160px;
      background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?w=1200&h=400&fit=crop');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* Profile photo overlapping the cover */
    .photo-wrapper {
      position: relative;
      margin-top: -70px;
      padding-left: 24px;
    }

    .photo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      background: #ddd;
    }

    .content {
      padding: 12px 24px 28px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 650;
      margin-bottom: 4px;
      color: #000000e6;
    }

    .headline {
      font-size: 1rem;
      color: #00000099;
      margin-bottom: 12px;
    }

    .location {
      font-size: 0.9rem;
      color: #00000099;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      background: #e8f3ff;
      color: #0a66c2;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 20px 0;
    }

    .about {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #000000e6;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <!-- Cover / Background image (LinkedIn style) -->
    <div class="cover"></div>

    <!-- Profile photo -->
    <div class="photo-wrapper">
      <img 
        src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&h=400&fit=crop" 
        alt="Boyani" 
        class="photo"
      >
    </div>

    <div class="content">
      <h1>Boyani</h1>
      <div class="headline">Hello, I'm Boyani from Vercel 🚀</div>
      <div class="location">My First Project</div>

      <div class="badge">Deployed on Vercel</div>

      <div class="divider"></div>

      <div class="about">
        Welcome to my first project. It works!
      </div>
    </div>
  </div>
</body>
</html>
