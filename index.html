<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boyani | My First Project</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #a5b4fc;
      font-size: 1.05rem;
      margin-bottom: 20px;
    }

    p {
      color: #e0e7ff;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.25);
      color: #c7d2fe;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Replace the src below with your own photo URL -->
    <img 
      src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&h=400&fit=crop" 
      alt="Boyani" 
      class="photo"
    >

    <h1>Hello, I'm Boyani</h1>
    <div class="subtitle">From Vercel 🚀</div>
    
    <p>Welcome to my first project. It works!</p>

    <div class="badge">Deployed on Vercel</div>
  </div>
</body>
</html>
